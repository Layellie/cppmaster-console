name: Build and release

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (Release)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build (Release)
        run: cmake --build build --config Release

      - name: Run tests (Release)
        run: ctest --test-dir build -C Release --output-on-failure

      # Ship-blocking on purpose: the binary published here is what users
      # download, so it should clear the stress suite too, not just the
      # fast unit tests.
      - name: Run generation stress tests (Release)
        run: ./build/Release/CppMasterConsoleStressTests.exe

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/CppMasterConsole.exe dist/CppMasterConsole.exe

      - name: Update "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "CppMaster Console (latest build)"
          # A rolling build, not a curated version: marking it prerelease
          # keeps it out of the repo's "Latest release" slot, which should
          # be reserved for real tagged versions. install.ps1 fetches the
          # `latest` tag's asset URL directly, so it is unaffected.
          prerelease: true
          body: |
            Automatically built from the most recent commit on `master`
            (${{ github.sha }}). Not a stable/tagged version — just the
            newest working build, used by `install.ps1`'s one-line
            install command.
          files: dist/CppMasterConsole.exe
